server:
  host: 127.0.0.1
  port: 8000

llama:
  bin_path: bin/llama-server/llama-server.exe
  llm:            # Qwen3.5-4B — raciocínio/SQL/NER/resposta final e desempate de rota
    model_path: models/Qwen3.5-4B-Q4_K_M.gguf
    host: 127.0.0.1
    port: 8080
    ctx_size: 8192   # medido: 16384 custava 1.17GB a mais de KV cache. O maior prompt
                     # de hoje (OpenIE) e ~1100 tokens, entao sobra 7x de folga.
    n_gpu_layers: -1
    temperature: 0.0   # medido: com 0.2, 2 de 6 respostas multi-hop saiam ERRADAS
                       # (4/6 certas). Com 0.0, 6/6. A amostragem nao era de graca.
  ocr:            # GLM-OCR ~830M params (~2.3GB VRAM) — candidato a "sob demanda"
    model_path: models/GLM-OCR-Q8_0.gguf
    mmproj_path: models/mmproj-GLM-OCR-Q8_0.gguf
    host: 127.0.0.1
    port: 8081
    ctx_size: 8192
    n_gpu_layers: -1
    sleep_idle_seconds: 60   # devolve a VRAM depois de 1 min ocioso; recarrega sozinho
  embeddings:
    model_path: models/bge-m3-Q8_0.gguf
    host: 127.0.0.1
    port: 8082
    ctx_size: 8192
    n_gpu_layers: -1
    dimensions: 1024
qdrant:
  bin_path: bin/qdrant/qdrant.exe
  storage_path: data/qdrant
  host: 127.0.0.1
  port: 6333
  collection: polyrag_docs
  distance: Cosine
  vector_size: 1024

paths:
  data_drop: data_drop
  processed: data/processed
  ingest_manifest: data/ingest_manifest.json   # arquivo -> rotas onde seus chunks caíram
  sqlite_db: data/sql/relacional.db
  graph_store: data/graph/graph.json

rags:
  relational:
    text_to_sql_prompt: |
      You are translating a question into a single SQLite SELECT query.

      Database schema:
      {schema}

      Question: {question}

      Rules:
      - Reply with ONLY the SQL query, no explanation, no markdown fences.
      - Use ONLY SELECT. Never INSERT, UPDATE, DELETE, DROP or ALTER.
      - Use only tables and columns that exist in the schema above.

      SQL:
  graph:
    seed_top_k: 5      # no máximo 5 nós semeiam o passeio; o PageRank decide o resto
    seed_floor: 0.45   # medido: pergunta fora do assunto satura em 0.41, pergunta
                       # legítima de grafo começa em 0.53 — 0.45 tem folga dos dois lados
    pagerank_damping: 0.85        # fator d do PageRank (0.85 = valor clássico do paper do Google)
    rrf_k: 60                     # constante clássica do RRF; medido, 1 a 60 dá o mesmo resultado aqui
    max_entity_words: 5           # acima disso é oração, não entidade — a tripla é descartada
    openie_prompt: |
      Extract subject-relation-object triples from the text.

      Subject and object must be SHORT ENTITY NAMES: a proper noun or a noun phrase
      of at most 4 words, copied exactly as written in the text.

      Example text:
      A Empresa Delta assina o Contrato Z com o Cliente Omega, que exige entrega mensal.

      Example JSON:
      [{{"subject": "Empresa Delta", "relation": "signs", "object": "Contrato Z"}},
       {{"subject": "Contrato Z", "relation": "signed_with", "object": "Cliente Omega"}},
       {{"subject": "Contrato Z", "relation": "requires", "object": "entrega mensal"}}]

      Three mistakes to avoid:

      1. Qualifying adjectives split one thing into two.
         WRONG: "Contrato Z valido"        RIGHT: "Contrato Z"
         The same thing must always get the same name, or the graph breaks in half.

      2. A clause is not an entity.
         WRONG: "entrega mensal antes de qualquer aprovacao do cliente"
         RIGHT: "entrega mensal"

      3. The subject performs the action; it does not receive it.
         Text: "O Contrato Z segue a Norma N."
         WRONG: {{"subject": "Norma N", "relation": "followed_by", "object": "Contrato Z"}}
         RIGHT: {{"subject": "Contrato Z", "relation": "follows", "object": "Norma N"}}

      Text:
      {text}

      Rules:
      - Reply with ONLY a JSON array, no explanation, no markdown fences.
      - Drop leading articles (o, a, os, as, um, uma) from entity names.
      - Use short snake_case verbs for the relation.
      - Extract only relationships explicitly stated in the text. Do not infer.
      - If there are no clear relationships, reply with an empty array: []

      JSON:

# ---------- Âncoras do Roteador (treinam o roteador sem escrever código) ----------
router:
  tau_heuristic: 0.8
  tau_high: 0.45
  tau_low: 0.35
  delta_margin: 0.08
  # NAO existe mais um juiz-modelo. O Estagio 3 era uma chamada de LLM e foi
  # medido tres vezes sem nunca compensar: na zona cinzenta o Estagio 2 sozinho
  # acertava 9/10 e o juiz 8/10, concordando com a geometria em 9 dos 10 casos.
  # Hoje o desempate usa os cabecalhos de secao que cada base declara ter -- ver
  # RAGBase.content_anchors. Todos os tres estagios sao aritmetica.
  routes:
    relational:
      description: "Dados tabulares, planilhas, finanças, logs estruturados"
      utterances:
        - "quantas vendas tivemos em março por região"
        - "qual o total de receita do trimestre"
        - "liste os 10 produtos mais vendidos"
        - "média salarial por departamento"
        - "soma das unidades vendidas por produto"
        - "qual valor aparece na coluna dessa planilha"
        - "compare os totais entre dois períodos do relatório numérico"
        - "qual item da tabela tem o maior número"
    vectorial:
      description: "Texto não estruturado, narrativas, documentos, artigos"
      utterances:
        - "a história e a trajetória da organização"
        - "o que este texto narra sobre o assunto"
        - "orientação de como proceder numa situação de atendimento ao público"
        - "o que o material escrito explica sobre o tema"
        - "fatos descritos ao longo de um texto corrido"
        - "o que a organização declara sobre seus valores e seu propósito"
        - "de que forma a equipe deve se comunicar com quem procura a empresa"
        - "detalhes contados em um documento descritivo sobre a instituição"
    graph:
      description: "Regras de negócio, compliance, dependências, multi-hop"
      utterances:
        - "se o fornecedor A falhar, quais contratos são afetados"
        - "quais políticas se aplicam a transferências internacionais"
        - "rastreie as dependências desse processo de aprovação"
        - "qual norma ou regulamento governa esse procedimento"
        - "quem detém a alçada para autorizar nesse caso"
        # Dizia "que sistema depende de qual outro sistema": a palavra "sistema"
        # sozinha puxava "o que motivou a criação do Sistema Atlas" — uma pergunta
        # de história — pra cá, com 0.466 contra 0.380 da rota certa. Uma âncora
        # deve descrever a FORMA da relação, não um substantivo do corpus.
        - "o que depende do que para continuar funcionando"
        - "qual prazo obrigatório está definido em regulamento interno"
        - "qual o efeito em cascata de uma falha nesse componente"

cache:
  enabled: true
  similarity_threshold: 0.80
  max_entries: 10000

orchestrator:
  top_k: 5
  answer_prompt: |
    Answer the question using ONLY the context below.

    Context:
    {context}

    Question: {question}

    Rules:
    - Reply in the language of the QUESTION, even when the context is written in a
      different one. Translate the facts; never switch to the context's language.
      (Measured: with a weaker phrasing the model followed the context instead, so
      an English question about a Portuguese document was answered in Portuguese.)
    - Answer directly, in at most 3 sentences. No preamble, no numbered reasoning
      steps, no restating the question, no "based on the context" framing.
    - Use only facts present in the context. Never invent data.
    - If the context does not answer the question, say so plainly.
    - Keep any table in Markdown format.

    WRONG:
      **Raciocinio baseado no contexto:**
      1. O valor da compra e de 80.000 reais.
      2. A Politica PC-04 exige aprovacao acima de 50.000 reais.
      3. Portanto, a compra requer aprovacao da Diretoria Financeira.

    RIGHT:
      A compra requer aprovacao previa da Diretoria Financeira, porque o Contrato
      Marco 2026 do Fornecedor Vega segue a Politica PC-04.

    Answer:

ingest:
  watch_interval_s: 2.0
  semantic_threshold: 0.5
  min_chunk_chars: 80
  ocr_prompt: "OCR"
  vision_extensions: [".png", ".jpg", ".jpeg", ".webp", ".bmp"]
  text_extensions: [".txt", ".md"]
  table_extensions: [".csv", ".xlsx"]
  document_extensions: [".pdf", ".docx", ".pptx"]

telemetry:
  enabled: true
  service_name: polyrag
  ring_buffer_size: 500
