# Golden set for scripts/evaluate.py, written against the demo/ corpus.
#
#   route     the store the router should choose
#   relevant  substrings that identify the chunks a correct retrieval must return.
#             Markers rather than chunk ids because ids are derived from content
#             and change whenever the corpus is re-chunked; a marker survives that.
#             Omitted for relational — SQL returns rows, not chunks, so recall@k
#             does not apply there.
#   facts     substrings the ANSWER must contain. Proper nouns and figures only,
#             never prose: those are the parts a model cannot legitimately reword,
#             so a substring check measures correctness rather than phrasing.
#
# Matching ignores case, accents and thousands separators, so "4.988.300",
# "4988300" and "R$ 4.988.300" all count as the same figure.
#
# 40 questions, which is what a 20-chunk corpus honestly supports. More would
# be the same questions rephrased, which inflates the denominator without
# measuring anything new.

# --------------------------------------------------------------------------- #
# relational — the figure has to be exact, and it comes from SQL, not from a
# model adding numbers in prose
# --------------------------------------------------------------------------- #

- question: Qual foi a receita total da regiao Sudeste?
  route: relational
  facts: ["4.988.300"]

- question: Qual a receita total da regiao Nordeste?
  route: relational
  facts: ["2.500.700"]

- question: Quanto a regiao Norte faturou no total?
  route: relational
  facts: ["1.415.800"]

- question: Qual foi a receita total de todas as regioes somadas?
  route: relational
  facts: ["12.950.950"]

- question: Qual foi a receita do mes de marco?
  route: relational
  facts: ["3.293.750"]

- question: Qual foi a receita do mes de abril?
  route: relational
  facts: ["3.454.400"]

- question: Quantas unidades de Armazenagem foram vendidas no total?
  route: relational
  facts: ["1.882"]

- question: Quantas unidades de Frete Rodoviario foram vendidas?
  route: relational
  facts: ["4.559"]

- question: Qual a receita total do produto Frete Rodoviario?
  route: relational
  facts: ["8.434.150"]

- question: Qual regiao teve a maior receita?
  route: relational
  facts: ["Sudeste"]

- question: Qual regiao teve a menor receita?
  route: relational
  facts: ["Norte"]

- question: Quantas unidades foram vendidas ao todo?
  route: relational
  facts: ["6.441"]

