# Held-out validation set — 40 questions, same demo/ corpus, same schema as
# golden_set.yaml.
#
# WHY THIS FILE EXISTS
#
# The fixes to routing and graph seeding were chosen by looking at which
# questions in golden_set.yaml failed. That makes golden_set.yaml a training
# set: a score on it after tuning against it measures fit, not capability.
#
# These 40 questions were written afterwards, straight from the six source
# documents, and were NOT looked at while any threshold, anchor or algorithm was
# chosen. A score here that matches the score there is evidence the changes
# generalise; a gap between them is evidence of overfitting. Either result is
# worth having, which is the point of keeping the two files separate.
#
# Deliberately different in shape from the golden set, to cover scenarios it
# does not: boundary values on the approval thresholds, single-hop lookups next
# to two-hop chains, negative questions ("can these be anonymised?"), questions
# about dates and frequencies, and prose questions phrased as instructions
# rather than as questions.
#
# One rule was applied while writing: no question whose answer lives in two
# stores at once. "How many regions does the company operate in" is such a
# question — the prose says five and `SELECT COUNT(DISTINCT regiao)` also says
# five — and a question two routes can both answer correctly cannot measure
# routing. It stays in the golden set, where it is documented; it is not
# repeated here.
#
# Relational figures were computed from the table, not recalled.

