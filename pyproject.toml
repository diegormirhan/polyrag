[project]
name = "polyrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openai>=3.3.1",
    "tabulate>=0.10.0",
    "qdrant-client>=1.19.0",
    "networkx>=3.6.1",
    "scipy>=1.18.1",
    "faiss-cpu==1.15.0",
    "opentelemetry-sdk>=1.44.0",
]

[dependency-groups]
dev = ["pytest>=8.3",]

[tool.pytest.ini_options]
pythonpath = ["backend"]
