[project]
name = "polyrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openai>=3.3.1",
    "tabulate>=0.10.0",
    "qdrant-client>=1.19.0",
    "networkx>=3.6.1",
    "scipy>=1.18.1",
    "faiss-cpu==1.15.0",
    "opentelemetry-sdk>=1.44.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in a signature default IS the FastAPI idiom, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.isort]
# backend/ is the source root, so `app` is ours — without this ruff files it
# under third-party and sorts it above fastapi.
known-first-party = ["app"]
