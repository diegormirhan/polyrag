name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push makes the previous run's result irrelevant, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --frozen fails if uv.lock disagrees with pyproject, so CI cannot pass
        # with a lockfile that would not reproduce this environment.
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check backend/ scripts/ tests/

      - name: Format
        run: uv run ruff format --check backend/ scripts/ tests/

      - name: Test
        # Only the tests that need nothing running. The pipeline's maths — cosine,
        # margin, the read-only SQL guard, triple parsing, the cache — is pure by
        # design precisely so it can be verified without a GPU, four llama-servers
        # and a vector database. The integration scripts under tests/ are run by
        # hand against a live stack; they define no test functions, so pytest
        # collects nothing from them.
        run: uv run pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render every Mermaid diagram
        # The architecture diagram shipped broken and nobody noticed: "graph" is
        # how Mermaid declares a diagram, so it cannot also be a node id, and
        # GitHub rendered a parse error in place of the picture. Reading a diagram
        # does not tell you whether it compiles -- only rendering it does.
        #
        # Every tracked Markdown file with a mermaid block, not just the README,
        # so a diagram added elsewhere is covered the day it lands.
        run: |
          set -euo pipefail
          files=$(git grep -l '```mermaid' -- '*.md')
          echo "$files"
          for file in $files; do
            out="$RUNNER_TEMP/$(basename "$file")"
            config=.github/puppeteer-config.json
            npx -y @mermaid-js/mermaid-cli@11 -p "$config" -i "$file" -o "$out"
          done
